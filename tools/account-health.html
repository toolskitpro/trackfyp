<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Health Check — TrackFyp</title>
<meta name="description" content="Apne TikTok profile ki posting consistency aur engagement trend check karein.">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script>window.BASE = "../";</script>
<div id="site-header"></div>

<div class="page-hero container">
  <div class="kicker">ACCOUNT HEALTH CHECK</div>
  <h1 class="page-title" data-ur="Account Health Check" data-en="Account Health Check">Account Health Check</h1>
  <p class="page-desc" data-ur="Profile link se posting consistency, engagement trend aur hashtag variety ka overall health score." data-en="An overall health score from posting consistency, engagement trend and hashtag variety.">Profile link se posting consistency, engagement trend aur hashtag variety ka overall health score.</p>
</div>

<div class="container" style="padding-bottom:60px;">
  <div class="card">
    <label class="field-label" data-ur="TikTok profile link" data-en="TikTok profile link">TikTok profile link</label>
    <div class="input-row">
      <input class="field-input" type="text" data-ur-ph="tiktok.com/@yourhandle" data-en-ph="tiktok.com/@yourhandle" placeholder="tiktok.com/@yourhandle">
      <button class="btn btn-hot" onclick="showBackendNote('note')" data-ur="Health check karein" data-en="Check health">Health check karein</button>
    </div>
    <div class="backend-note" id="note">
      <b data-ur="Ye feature abhi live nahi hai." data-en="This feature isn't live yet.">Ye feature abhi live nahi hai.</b>
      <span data-ur=" Profile ka history data lene ke liye backend server chahiye. Agle phase mein add hoga." data-en=" Reading a profile's history needs a backend server. Coming in the next phase.">Profile ka history data lene ke liye backend server chahiye. Agle phase mein add hoga.</span>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="../js/main.js"></script>
</body>
</html>

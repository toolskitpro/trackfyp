<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending Now — TrackFyp</title>
<meta name="description" content="Apna country chunein aur wahan ke trending TikTok sounds, hashtags aur video styles dekhein.">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script>window.BASE = "../";</script>
<div id="site-header"></div>

<div class="page-hero container">
  <div class="kicker">TRENDING NOW</div>
  <h1 class="page-title" data-ur="Trending Now" data-en="Trending Now">Trending Now</h1>
  <p class="page-desc" data-ur="Apna country chunein aur wahan ke trending sounds, hashtags aur video styles dekhein." data-en="Pick your country and see what's trending there right now.">Apna country chunein aur wahan ke trending sounds, hashtags aur video styles dekhein.</p>
</div>

<div class="container" style="padding-bottom:60px;">
  <div class="card">
    <label class="field-label" data-ur="Apna country chunein" data-en="Pick your country">Apna country chunein</label>
    <select class="field-input" id="countrySelect">
      <option value="global">Global (sab countries)</option>
      <option value="pk">Pakistan</option>
      <option value="in">India</option>
      <option value="ae">UAE</option>
      <option value="us">USA</option>
      <option value="uk">UK</option>
    </select>
    <button class="btn btn-hot" id="trendBtn" data-ur="Trending list dekhein" data-en="See trending list">Trending list dekhein</button>
    <div class="result-box" id="resultBox">
      <div id="trendOutput"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="../js/main.js"></script>
<script>
  const BACKEND_URL = "https://trackfyp-backend.onrender.com";

  document.getElementById("trendBtn").addEventListener("click", async () => {
    const country = document.getElementById("countrySelect").value;
    const resultBox = document.getElementById("resultBox");
    const out = document.getElementById("trendOutput");

    out.innerHTML = "Processing...";
    resultBox.classList.add("show");

    try {
      const res = await fetch(`${BACKEND_URL}/api/trending?country=${country}`);
      const data = await res.json();

      if (data.success && data.trends.length) {
        let html = "";
        data.trends.forEach((t, i) => {
          html += `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;">
            <span>#${i + 1} — #${t.hashtag}</span>
            ${t.posts ? `<span style="color:var(--muted);">${t.posts}</span>` : ""}
          </div>`;
        });
        out.innerHTML = html;
      } else {
        out.innerHTML = data.error || "Abhi koi trending data nahi mila.";
      }
    } catch (err) {
      out.innerHTML = "Backend se connect nahi ho saka. Thodi der baad try karein.";
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Time to Post — TrackFyp</title>
<meta name="description" content="Apna country chunein aur TikTok par post karne ka behtareen waqt maloom karein.">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script>window.BASE = "../";</script>
<div id="site-header"></div>

<div class="page-hero container">
  <div class="kicker">BEST TIME TO POST</div>
  <h1 class="page-title" data-ur="Best Time to Post" data-en="Best Time to Post">Best Time to Post</h1>
  <p class="page-desc" data-ur="Apna country chunein aur janein kis waqt post karne se zyada log online hote hain — behtar reach ke liye." data-en="Pick your country and find out when your audience is most active — for better reach.">Apna country chunein aur janein kis waqt post karne se zyada log online hote hain — behtar reach ke liye.</p>
</div>

<div class="container" style="padding-bottom:60px;">
  <div class="card">
    <label class="field-label" data-ur="Apna country chunein" data-en="Pick your country">Apna country chunein</label>
    <select class="field-input" id="countrySelect">
      <option value="pk">Pakistan</option>
      <option value="in">India</option>
      <option value="ae">UAE</option>
      <option value="us">USA</option>
      <option value="uk">UK</option>
    </select>

    <div class="result-box show" id="resultBox">
      <div class="section-sub" data-ur="Weekdays (Mon–Thu)" data-en="Weekdays (Mon–Thu)">Weekdays (Mon–Thu)</div>
      <p id="weekdayResult" style="margin:4px 0 0;font-size:15px;"></p>
      <div class="section-sub" data-ur="Weekend (Fri–Sun)" data-en="Weekend (Fri–Sun)">Weekend (Fri–Sun)</div>
      <p id="weekendResult" style="margin:4px 0 0;font-size:15px;"></p>
      <div class="section-sub" data-ur="Kyun" data-en="Why">Kyun</div>
      <p id="whyResult" style="margin:4px 0 0;color:var(--muted);font-size:13px;"></p>
    </div>
    <p style="margin-top:16px;color:var(--muted);font-size:11.5px;" data-ur="Ye general audience-behaviour trends par based hai — aapke apne data se hi sabse accurate result milta hai jab aap videos post karte rahenge." data-en="Based on general audience-behaviour trends — this gets more accurate over time as you post.">Ye general audience-behaviour trends par based hai.</p>
  </div>
</div>

<div id="site-footer"></div>
<script src="../js/main.js"></script>
<script>
  const DATA = {
    pk: {
      weekday: "Shaam 7:00 – 10:00 baje (PKT)",
      weekend: "Raat 9:00 – 11:00 baje (Jumma–Hafta)",
      why: "Office/school ke baad log free hote hain, aur weekend pe raat der tak online rehte hain."
    },
    in: {
      weekday: "Shaam 6:30 – 9:30 baje (IST)",
      weekend: "Raat 8:00 – 11:00 baje",
      why: "Kaam khatam hone ke baad ka waqt, jab commute bhi mobile scrolling mein guzarta hai."
    },
    ae: {
      weekday: "Raat 8:00 – 11:00 baje (GST)",
      weekend: "Raat 9:00 baje – 12:00 baje (Jumma–Hafta)",
      why: "Kaam ka din der se shuru hota hai, isliye evening/night engagement zyada hoti hai."
    },
    us: {
      weekday: "Evening 7:00 – 9:00 PM (local time zone)",
      weekend: "11:00 AM – 1:00 PM aur 7:00 – 9:00 PM",
      why: "After-work scrolling aur weekend leisure time dono high-engagement windows hain."
    },
    uk: {
      weekday: "Evening 6:00 – 9:00 PM (GMT/BST)",
      weekend: "12:00 – 2:00 PM aur 7:00 – 10:00 PM",
      why: "Commute ke baad aur weekend lunch time dono active periods hain."
    }
  };

  function render(country){
    const d = DATA[country];
    document.getElementById("weekdayResult").textContent = d.weekday;
    document.getElementById("weekendResult").textContent = d.weekend;
    document.getElementById("whyResult").textContent = d.why;
  }

  document.getElementById("countrySelect").addEventListener("change", e => render(e.target.value));
  render("pk");
</script>
</body>
</html>

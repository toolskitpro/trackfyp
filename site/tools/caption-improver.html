<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caption Improver — TrackFyp</title>
<meta name="description" content="Apni TikTok caption paste karein aur behtar, engaging version payein — hook aur call-to-action suggestions ke sath.">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script>window.BASE = "../";</script>
<div id="site-header"></div>

<div class="page-hero container">
  <div class="kicker">CAPTION IMPROVER</div>
  <h1 class="page-title" data-ur="Caption / Title Improver" data-en="Caption / Title Improver">Caption / Title Improver</h1>
  <p class="page-desc" data-ur="Apni caption paste karein. Ye tool checklist ke hisab se improvement suggestions deta hai — length, hook, aur call-to-action check karke." data-en="Paste your caption. This checks length, hook and call-to-action, and gives suggestions.">Apni caption paste karein. Ye tool checklist ke hisab se improvement suggestions deta hai — length, hook, aur call-to-action check karke.</p>
</div>

<div class="container" style="padding-bottom:60px;">
  <div class="card">
    <label class="field-label" data-ur="Apni caption yahan paste karein" data-en="Paste your caption here">Apni caption yahan paste karein</label>
    <textarea class="field-textarea" id="captionInput" data-ur-ph="jaise: nayi video dekhein" data-en-ph="e.g. check out my new video" placeholder="jaise: nayi video dekhein"></textarea>
    <button class="btn btn-hot" id="checkBtn" data-ur="Check karein" data-en="Check">Check karein</button>

    <div class="result-box" id="resultBox">
      <div id="suggestionList"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="../js/main.js"></script>
<script>
  const HOOK_STARTERS = ["Wait for it...", "Ye trick kaam karti hai:", "5 second mein sikhein:", "Aap ye nahi jante honge:"];
  const CTA_WORDS = ["comment", "follow", "share", "save", "dekhein", "batayein", "like"];

  function analyze(caption){
    const issues = [];
    const wordCount = caption.trim().split(/\s+/).filter(Boolean).length;

    if(wordCount < 4){
      issues.push({type:"bad", ur:"Caption bohot chota hai — sirf "+wordCount+" alfaz. Kam se kam ek line ka context dein.", en:"Caption is too short — only "+wordCount+" words. Add at least a full line of context."});
    } else if(wordCount > 40){
      issues.push({type:"warn", ur:"Caption thora lamba hai ("+wordCount+" alfaz). Pehli 1-2 lines mein hi main baat keh dein.", en:"Caption is a bit long ("+wordCount+" words). Say the main point in the first 1-2 lines."});
    } else {
      issues.push({type:"good", ur:"Caption ki length theek hai.", en:"Caption length looks good."});
    }

    const hasCTA = CTA_WORDS.some(w => caption.toLowerCase().includes(w));
    if(!hasCTA){
      issues.push({type:"warn", ur:"Koi call-to-action nahi mila (jaise 'comment karein' ya 'follow karein'). Ek add karein.", en:"No call-to-action found (like 'comment' or 'follow'). Consider adding one."});
    } else {
      issues.push({type:"good", ur:"Call-to-action maujood hai.", en:"Call-to-action is present."});
    }

    const hasHashtag = caption.includes("#");
    if(!hasHashtag){
      issues.push({type:"warn", ur:"Koi hashtag nahi hai. Hamare Hashtag Generator se 3-5 add karein.", en:"No hashtags found. Add 3-5 using our Hashtag Generator."});
    }

    return issues;
  }

  document.getElementById("checkBtn").addEventListener("click", () => {
    const val = document.getElementById("captionInput").value.trim();
    if(!val) return;
    const issues = analyze(val);
    const dotClass = {good:"var(--teal)", warn:"var(--gold)", bad:"var(--hot)"};
    let html = "";
    issues.forEach(it => {
      html += `<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);">
        <span style="width:8px;height:8px;border-radius:50%;background:${dotClass[it.type]};margin-top:6px;flex-shrink:0;"></span>
        <span data-ur="${it.ur}" data-en="${it.en}">${it.ur}</span>
      </div>`;
    });
    html += `<div class="section-sub" data-ur="Hook idea aazmayein" data-en="Try a hook idea">Hook idea aazmayein</div>
      <div class="tag-cloud">${HOOK_STARTERS.map(h=>`<span class="tag teal">${h}</span>`).join("")}</div>`;
    document.getElementById("suggestionList").innerHTML = html;
    document.getElementById("resultBox").classList.add("show");
  });
</script>
</body>
</html>
